name: Noveo device IPA and TIPA
on:
  workflow_dispatch:
    inputs:
      cold_build:
        description: Skip all restored caches and populate a fresh Drive snapshot
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: noveo-device-${{ inputs.cold_build && github.run_id || github.ref }}
  cancel-in-progress: false
jobs:
  device:
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      NOVEO_RCLONE_CONFIG: ${{ secrets.NOVEO_RCLONE_CONFIG }}
      DRIVE_CACHE: noveocache:noveo-build-cache/ios-device-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure temporary credential path
        run: echo "RCLONE_CONFIG=$RUNNER_TEMP/noveo-rclone.conf" >> "$GITHUB_ENV"
      - name: Verify cold-build cache destination
        if: inputs.cold_build == true
        run: |
          test -n "$NOVEO_RCLONE_CONFIG" || { echo 'Cold cache-seeding build requires the Google Drive secret.'; exit 1; }
          echo 'Cold build: both cache restores are skipped; the resulting disk cache will be uploaded to Drive.'
      - name: Select pinned Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          test -d "/Applications/Xcode_${XCODE_VERSION}.app"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
      - name: Set up Google Drive cache
        if: env.NOVEO_RCLONE_CONFIG != ''
        run: |
          command -v rclone >/dev/null || brew install rclone
          echo "DRIVE_CACHE=$DRIVE_CACHE/${{ hashFiles('versions.json', 'MODULE.bazel.lock', '.gitmodules') }}" >> "$GITHUB_ENV"
          python3 - <<'PYCONFIG'
          import os
          from pathlib import Path
          path = Path(os.environ['RCLONE_CONFIG'])
          path.write_text(os.environ['NOVEO_RCLONE_CONFIG'])
          path.chmod(0o600)
          PYCONFIG
      - name: Restore Google Drive cache
        id: drive-cache
        if: inputs.cold_build != true && env.NOVEO_RCLONE_CONFIG != ''
        continue-on-error: true
        timeout-minutes: 30
        run: python3 tools/noveo/drive_cache.py restore "$HOME/noveo-bazel-cache" "$DRIVE_CACHE"
      - uses: actions/cache/restore@v4
        if: inputs.cold_build != true && (env.NOVEO_RCLONE_CONFIG == '' || steps.drive-cache.outputs.hit != 'true')
        id: bazel-cache
        with:
          path: ~/noveo-bazel-cache
          key: noveo-ios-bazel-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock', '.gitmodules') }}-device-${{ github.sha }}
          restore-keys: |
            noveo-ios-bazel-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock', '.gitmodules') }}-device-
            noveo-ios-bazel-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock', '.gitmodules') }}-
      - name: Enable unprovisioned archive packaging for test workflow
        run: |
          git -C build-system/bazel-rules/rules_apple apply --check "$GITHUB_WORKSPACE/tools/noveo/unprovisioned-profiles.patch"
          git -C build-system/bazel-rules/rules_apple apply "$GITHUB_WORKSPACE/tools/noveo/unprovisioned-profiles.patch"
      - name: Prepare unprovisioned device test configuration
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('build-system/appstore-configuration.json').read_text())
          config.update(bundle_id='ir.noveo.ios', team_id='NOVEOTEST0',
                        is_internal_build='true', is_appstore_build='false',
                        app_specific_url_scheme='noveo', enable_icloud=False, enable_siri=False)
          Path(os.environ['RUNNER_TEMP'], 'noveo-device.json').write_text(json.dumps(config))
          PY
          mkdir -p "$HOME/noveo-bazel-cache"
          if [ -z "$NOVEO_RCLONE_CONFIG" ]; then
            echo 'build --experimental_disk_cache_gc_max_size=5G' >> "$HOME/.bazelrc"
          fi
          echo 'build --define=apple.compress_ipa=true' >> "$HOME/.bazelrc"
          echo 'build --features=disable_legacy_signing' >> "$HOME/.bazelrc"
          echo 'build --//Telegram:disableProvisioningProfiles' >> "$HOME/.bazelrc"
      - name: Build complete arm64 device app
        run: |
          set -o pipefail
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/noveo-bazel-cache" \
            build --configurationPath="$RUNNER_TEMP/noveo-device.json" \
            --xcodeManagedCodesigning --configuration=debug_arm64 \
            --buildNumber="${{ github.run_number }}" \
            2>&1 | tee "$RUNNER_TEMP/noveo-device-build.log"
      - name: Validate device archive and package IPA and TIPA
        run: python3 tools/noveo/package_device.py bazel-bin/Telegram/Telegram.ipa "$GITHUB_WORKSPACE/build/device-test-artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: Noveo-iOS-device-test-${{ github.run_number }}
          path: build/device-test-artifacts/
          compression-level: 0
          if-no-files-found: error
      - name: Save Google Drive cache
        if: always() && !cancelled() && env.NOVEO_RCLONE_CONFIG != ''
        continue-on-error: true
        timeout-minutes: 45
        run: |
          BAZEL_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["bazel"].split(":")[0])')
          if [ -x "build-input/bazel-$BAZEL_VERSION-darwin-arm64" ]; then
            "build-input/bazel-$BAZEL_VERSION-darwin-arm64" shutdown
          fi
          python3 tools/noveo/drive_cache.py save "$HOME/noveo-bazel-cache" "$DRIVE_CACHE"
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && env.NOVEO_RCLONE_CONFIG == '' && steps.bazel-cache.outputs.cache-hit != 'true'
        with:
          path: ~/noveo-bazel-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noveo-device-build-log
          path: ${{ runner.temp }}/noveo-device-build.log
          if-no-files-found: ignore
      - name: Remove temporary Drive credentials
        if: always()
        run: |
          python3 - <<'PYCONFIG'
          import os
          from pathlib import Path
          Path(os.environ['RCLONE_CONFIG']).unlink(missing_ok=True)
          PYCONFIG
