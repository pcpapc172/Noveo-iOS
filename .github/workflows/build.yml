name: Noveo device IPA and TIPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noveo-device-${{ github.ref }}
  cancel-in-progress: false
jobs:
  device:
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select pinned Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          test -d "/Applications/Xcode_${XCODE_VERSION}.app"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
      - uses: actions/cache/restore@v4
        id: bazel-cache
        with:
          path: ~/noveo-bazel-cache
          key: noveo-ios-bazel-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock', '.gitmodules') }}-device-${{ github.sha }}
          restore-keys: |
            noveo-ios-bazel-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock', '.gitmodules') }}-device-
            noveo-ios-bazel-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel.lock', '.gitmodules') }}-
      - name: Enable unprovisioned archive packaging for test workflow
        run: |
          git -C build-system/bazel-rules/rules_apple apply --check "$GITHUB_WORKSPACE/tools/noveo/unprovisioned-profiles.patch"
          git -C build-system/bazel-rules/rules_apple apply "$GITHUB_WORKSPACE/tools/noveo/unprovisioned-profiles.patch"
      - name: Prepare unprovisioned device test configuration
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('build-system/appstore-configuration.json').read_text())
          config.update(bundle_id='ir.noveo.ios', team_id='NOVEOTEST0',
                        is_internal_build='true', is_appstore_build='false',
                        app_specific_url_scheme='noveo', enable_icloud=False, enable_siri=False)
          Path(os.environ['RUNNER_TEMP'], 'noveo-device.json').write_text(json.dumps(config))
          PY
          mkdir -p "$HOME/noveo-bazel-cache"
          echo 'build --experimental_disk_cache_gc_max_size=5G' >> "$HOME/.bazelrc"
          echo 'build --define=apple.compress_ipa=true' >> "$HOME/.bazelrc"
          echo 'build --features=disable_legacy_signing' >> "$HOME/.bazelrc"
          echo 'build --//Telegram:disableProvisioningProfiles' >> "$HOME/.bazelrc"
      - name: Build complete arm64 device app
        run: |
          set -o pipefail
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/noveo-bazel-cache" \
            build --configurationPath="$RUNNER_TEMP/noveo-device.json" \
            --xcodeManagedCodesigning --configuration=debug_arm64 \
            --buildNumber="${{ github.run_number }}" \
            2>&1 | tee "$RUNNER_TEMP/noveo-device-build.log"
      - name: Validate device archive and package IPA and TIPA
        run: python3 tools/noveo/package_device.py bazel-bin/Telegram/Telegram.ipa "$GITHUB_WORKSPACE/build/device-test-artifacts"
      - uses: actions/upload-artifact@v4
        with:
          name: Noveo-iOS-device-test-${{ github.run_number }}
          path: build/device-test-artifacts/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && steps.bazel-cache.outputs.cache-hit != 'true'
        with:
          path: ~/noveo-bazel-cache
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noveo-device-build-log
          path: ${{ runner.temp }}/noveo-device-build.log
          if-no-files-found: ignore
